name: RajPut Caption AI Workflow

on:
  schedule:
    # روزانہ 04:00 UTC (9:00 AM PKT) پر خود بخود چلتا ہے
    - cron: '0 4 * * *'
  workflow_dispatch: # آپ کو مینوئل طریقے سے چلانے کے لیے بٹن کلک کرنے کی اجازت دیتا ہے

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🎬 Install System Dependencies & Unlock ImageMagick
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y ffmpeg imagemagick fonts-liberation -qq
          sudo sed -i '/<policy domain="path" rights="none" pattern="@\*"/d' /etc/ImageMagick-6/policy.xml

      - name: 📦 Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          # یہاں ہم نے nbconvert ایڈ کر دیا ہے جو فائل خود بدل دے گا
          pip install moviepy==1.0.3 assemblyai google-generativeai pydub numpy gdown nbconvert

      - name: 📥 Download Video from Google Drive
        run: |
          mkdir -p YT_Tool_output/sad_peotry/
          gdown "https://drive.google.com/uc?id=1rnzSPJcZzX2wW67RYOc8dUhaKbUHTK3e" -O YT_Tool_output/sad_peotry/input_video.mp4

      - name: 🔄 Automatically Convert IPYNB to PY File
        run: |
         jupyter nbconvert --to script "03_C_Caption_Ai_3.ipynb"
        #  mv "03_C_Caption_Ai_3.py" run_captions.py

          
      - name: 🤖 Run the Caption AI Script
        env:
          #ASSEMBLYAI_KEY: ${{ secrets.ASSEMBLYAI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python caption.py 

      - name: 💾 Upload Final CC Videos
        uses: actions/upload-artifact@v4
        with:
          name: Magic-Caption-Videos
          path: YT_output_CC/
          retention-days: 5
