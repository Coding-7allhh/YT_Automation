name: Video Data Engine & Supabase Sync

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab
  schedule:
    # Set to run daily at 04:00 UTC (09:00 AM PKT)
    - cron: '0 4 * * *'

jobs:
  process-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Caches dependencies to speed up future runs

      - name: Install System Dependencies (FFmpeg)
        # Required for MoviePy to extract video thumbnails successfully
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg -qq

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install supabase google-generativeai "moviepy>=2.0.0" requests

      - name: Execute Advanced Uploader
        env:
          # Pulls the secure API keys you set up in GitHub Secrets
         # SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
         # SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
         # DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python uploader.py

      - name: Save Thumbnails as Artifacts (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: Generated_Thumbnails
          path: YT_output_CC/thum/
          retention-days: 5
