name: Video Data Engine & Supabase Sync

on:
  schedule:
    # روزانہ 04:00 UTC (9:00 AM PKT) پر خود بخود چلتا ہے
    - cron: '0 4 * * *'
  workflow_dispatch: # آپ کو مینوئل طریقے سے چلانے کے لیے بٹن کلک کرنے کی اجازت دیتا ہے

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        
      - name: Install System Dependencies (FFmpeg)
        # Required for MoviePy to extract video thumbnails successfully
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg -qq

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install supabase google-generativeai "moviepy>=2.0.0" requests


      - name: 📥 Download Video from Google Drive
        run: |
          mkdir -p YT_output_CC/sad_peotry/
          gdown "https://drive.google.com/uc?id=1rnzSPJcZzX2wW67RYOc8dUhaKbUHTK3e" -O YT_output_CC/sad_peotry/input_video.mp4
    
      - name: Execute Advanced Uploader
        env:
          # Pulls the secure API keys you set up in GitHub Secrets
         # SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
         # SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
         # DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python uploader.py

      - name: Save Thumbnails as Artifacts (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: Generated_Thumbnails
          path: YT_output_CC/thum/
          retention-days: 5
