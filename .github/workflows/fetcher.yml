name: 📥 Fetch & Organize YouTube Assets

on:
  workflow_dispatch: # Allows you to manually trigger this workflow from the GitHub UI

jobs:
  process-drive-assets:
    runs-on: ubuntu-latest
    name: 🎬 Process & Upload Drive Assets

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: 🚀 Run Fetcher Script
        id: run_script
        run: |
          # Run the python script and pipe output to a log file for the UI summary
          python fetcher.py | tee script_execution.log

      - name: 📊 Generate UI Dashboard (Job Summary)
        if: always()
        run: |
          echo "## 🎬 YouTube Assets Processing Report" >> $GITHUB_STEP_SUMMARY
          echo "Your Google Drive fetcher script has finished executing. Here is the breakdown of the processed files." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📂 Organized Files Status" >> $GITHUB_STEP_SUMMARY
          echo "| Category | 🎞️ Videos | 📄 JSONs |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|---------|" >> $GITHUB_STEP_SUMMARY
          
          # Bash logic to scan the output directory and populate the UI table
          if [ -d "YT_Tool_Input" ]; then
            for category_path in YT_Tool_Input/*/; do
              if [ -d "$category_path" ]; then
                category=$(basename "$category_path")
                videos=$(find "$category_path/YT_Video" -name "*.mp4" 2>/dev/null | wc -l || echo 0)
                jsons=$(find "$category_path/JSON" -name "*.json" 2>/dev/null | wc -l || echo 0)
                echo "| **$category** | $videos | $jsons |" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "| ❌ Processing Failed / No Outputs | 0 | 0 |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📜 Terminal Execution Log" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Click to expand terminal output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          cat script_execution.log >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Task Completed!** If files were successfully generated, scroll down to the **Artifacts** section below to download them." >> $GITHUB_STEP_SUMMARY

      - name: 💾 Upload Organized Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Organized-YT-Assets
          path: YT_Tool_Input/
          retention-days: 7 # The zip file will be available to download for 7 days
          if-no-files-found: warn
