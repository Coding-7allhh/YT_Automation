name: YT Automation Fetcher

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      cleanup:
        description: 'Clean up old artifacts after run'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  
  # Scheduled runs (daily at 2 AM UTC)
 # schedule:
  #  - cron: '0 2 * * *'

jobs:
  fetch-and-organize:
    runs-on: ubuntu-latest
    timeout-minutes: 530
    
    permissions:
      contents: read
      artifacts: write
    
    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Python environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown requests urllib3

      # Step 4: Create timestamp for logging
      - name: Generate timestamp
        id: timestamp
        run: echo "date=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

      # Step 5: Run fetcher script
      - name: Run YT Automation Fetcher
        id: fetcher
        run: |
          python fetcher.py 2>&1 | tee fetcher_${{ steps.timestamp.outputs.date }}.log
        continue-on-error: true

      # Step 6: Check if output folder exists
      - name: Verify output directory
        id: verify
        run: |
          if [ -d "YT_Tool_Input" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            find YT_Tool_Input -type f | wc -l > file_count.txt
            du -sh YT_Tool_Input > folder_size.txt
            cat file_count.txt
            cat folder_size.txt
          else
            echo "status=empty" >> $GITHUB_OUTPUT
            echo "0" > file_count.txt
            echo "0B" > folder_size.txt
          fi

      # Step 7: Create artifact summary
      - name: Generate artifact summary
        if: steps.verify.outputs.status == 'success'
        run: |
          cat > artifact_summary.md << 'EOF'
          # YT Automation Fetcher Report
          
          **Run Date:** ${{ steps.timestamp.outputs.date }}
          **Status:** ✅ Success
          
          ## Statistics
          - **Files Processed:** $(cat file_count.txt)
          - **Total Size:** $(cat folder_size.txt)
          - **Execution Time:** Check workflow logs
          
          ## Output Structure
          ```
          YT_Tool_Input/
          ├── [Category]/
          │   ├── YT_Video/
          │   │   └── [organized_videos].mp4
          │   └── JSON/
          │       └── [video_metadata].json
          ```
          
          **Download artifacts to access organized files.**
          EOF
          cat artifact_summary.md

      # Step 8: Upload organized files as artifact
      - name: Upload YT_Tool_Input folder
        if: steps.verify.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: yt-tool-input-${{ steps.timestamp.outputs.date }}
          path: YT_Tool_Input/
          retention-days: 30
          if-no-files-found: warn

      # Step 9: Upload logs as artifact
      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetcher-logs-${{ steps.timestamp.outputs.date }}
          path: |
            fetcher_*.log
            artifact_summary.md
            file_count.txt
            folder_size.txt
          retention-days: 30
          if-no-files-found: ignore

      # Step 10: Notify on success
      - name: Success notification
        if: steps.verify.outputs.status == 'success'
        run: |
          echo "✅ YT Automation Fetcher completed successfully!"
          echo "📊 Files processed: $(cat file_count.txt)"
          echo "📦 Artifact size: $(cat folder_size.txt)"

      # Step 11: Notify on failure
      - name: Failure notification
        if: failure() || steps.verify.outputs.status == 'empty'
        run: |
          echo "❌ YT Automation Fetcher encountered issues"
          echo "Check the logs for details"

  # Optional: Clean up old artifacts
  cleanup-artifacts:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.cleanup == 'true'
    runs-on: ubuntu-latest
    needs: fetch-and-organize
    steps:
      - name: Delete artifacts older than 30 days
        uses: geekyeggo/delete-artifact@v2
        with:
          name: |
            yt-tool-input-*
            fetcher-logs-*
          minCreatedDays: 7
