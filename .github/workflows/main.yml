name: Force Run My Automation App

on:
  schedule:
    - cron: '0 4 * * *' # Pakistan Standard Time (PKT) ke mutabiq rozana subah 9:00 AM
  workflow_dispatch: # Manual run karne ke liye button

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Required Packages
      run: |
        python -m pip install --upgrade pip
        pip install jupyter nbconvert supabase postgrest httpx moviepy gdown h11 cryptography ipython
        pip install yt-dlp feedparser supabase tqdm requests beautifulsoup4 python-dateutil moviepy==2.0.0
        pip install assemblyai google-generativeai pydub numpy google-generativeai
        apt-get update -qq && apt-get install -y imagemagick fonts-liberation -qq
       # sed -i 's/domain=\"path\" rights=\"none\" pattern=\"@\\*\"/domain=\"path\" rights=\"read|write\" pattern=\"@\\*\"/g' /etc/ImageMagick-6/policy.xml

    - name: Convert Main Notebook to Python
      run: |
        echo "🔄 Converting notebook to pure Python script..."
        jupyter nbconvert --to python *.ipynb

    # Colab ke paths ko GitHub ke mutabiq change karna aur IPython bypass code inject karna
    - name: Inject Fixes and Path Modifications
      run: |
        echo "🛠️ Replacing Colab paths with GitHub workspace paths..."
        # 1. Yeh line '/content/' path ko normal folder me convert karegi
        sed -i "s|/content/||g" All_Run_app_1.py
        sed -i "s|/content||g" All_Run_app_1.py
        
        # 2. Yeh line get_ipython ka error hamesha ke liye bypass karegi
        sed -i '1s/^/def get_ipython():\n    class Dummy:\n        def system(self, cmd): pass\n    return Dummy()\n\n/' All_Run_app_1.py

    # 🔥 SINGLE SECRET STEP: Sirf DRIVE_URLS pass kiya hai
    - name: Execute Main Orchestrator Script
      env:
        DRIVE_URLS: ${{ secrets.DRIVE_URLS }} # Sirf aik secret variable use ho raha hai
        PYTHONUNBUFFERED: "1"
      run: |
        echo "🔥 Executing the orchestrator application..."
        python -u All_Run_app_1.py

    - name: Secure Environment Wipe
      if: always()
      run: |
        echo "🗑️ Cleaning up temporary python files..."
        rm -f *.py
        echo "✨ Environment cleaned up successfully!"
