name: Force Run My Automation App

on:
  schedule:
    - cron: '0 4 * * *' # Pakistan time subah 9:00 AM
  workflow_dispatch: # Manual run ka button

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Required Packages
      run: |
        python -m pip install --upgrade pip
        pip install jupyter nbconvert supabase postgrest httpx moviepy gdown h11 cryptography

    # STARTS HERE: Yeh step automatic har notebook dhoond kar convert karega
    - name: Convert Main Notebook to Python
      run: |
        echo "🔄 Automatically finding and converting Jupyter Notebook..."
        # Yeh command poori repository mein '*.ipynb' dhoondegi, naam ki galti nahi hogi
        jupyter nbconvert --to python *.ipynb

    - name: Execute Main Orchestrator Script
      env:
        DRIVE_URLS: ${{ secrets.DRIVE_URLS }}
        #SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        PYTHONUNBUFFERED: "1"
      run: |
        echo "🔥 Finding and executing the converted python script..."
        # Yeh automatic bani hui .py file ko run kar degi chahe naam kuch bhi ho
        python -u *.py

    - name: Secure Environment Wipe
      if: always()
      run: |
        echo "🗑️ Cleaning up temporary python files..."
        rm -f *.py
        echo "✨ Environment cleaned up successfully!"
