name: Force Run My Automation App

on:
  schedule:
    - cron: '0 4 * * *' # Pakistan time subah 9:00 AM
  workflow_dispatch: # Manual run ka button

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    # Yahan humne network timeouts ko handle karne ke liye h11 aur cryptography packages add kiye hain
    - name: Install Required Packages
      run: |
        python -m pip install --upgrade pip
        pip install jupyter nbconvert supabase postgrest httpx moviepy gdown h11 cryptography

    - name: Convert Main Notebook to Python
      run: |
        echo "🔄 Converting notebook into python..."
        jupyter nbconvert --to python "All Run app_1.ipynb"

    # Python -u flag lagaya hai taake network errors line-by-line real-time show hon
    - name: Execute Main Orchestrator Script
      env:
        DRIVE_URLS: ${{ secrets.DRIVE_URLS }}
       # SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        PYTHONUNBUFFERED: "1"
      run: |
        echo "🔥 Main orchestrator running..."
        python -u "All Run app_1.py"

    - name: Secure Environment Wipe
      if: always()
      run: |
        rm -f "All Run app_1.py"
        echo "✨ Environment cleaned up successfully!"
