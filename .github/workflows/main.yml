name: Force Run My Automation App

on:
  schedule:
    - cron: '0 4 * * *' # Pakistan Standard Time (PKT) ke mutabiq rozana subah 9:00 AM
  workflow_dispatch: # Manual run karne ke liye button

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 1. System Packages (FFmpeg, ImageMagick, Fonts) with Sudo
    - name: Install System Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y ffmpeg imagemagick fonts-liberation -qq

    # 2. All Python Libraries (Pip upgraded, MoviePy fixed to 2.0.0, AI & Web Packages)
    - name: Install All Python Packages
      run: |
        python -m pip install --upgrade pip
        pip install jupyter nbconvert supabase postgrest httpx gdown h11 cryptography ipython
        pip install yt-dlp feedparser tqdm requests beautifulsoup4 python-dateutil
        pip install assemblyai google-generativeai pydub numpy
        pip install moviepy==2.0.0

    # 3. ImageMagick Security Policy Fix with Root/Sudo Permissions
    - name: Fix ImageMagick Security Policy
      run: |
        echo "🛠️ Modifying ImageMagick policy with root permissions..."
        if [ -f /etc/ImageMagick-6/policy.xml ]; then
          sudo sed -i 's/domain="path" rights="none" pattern="@\*"/domain="path" rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml
        fi

    # 4. Notebook to Python conversion
    - name: Convert Main Notebook to Python
      run: |
        echo "🔄 Converting notebook to pure Python script..."
        jupyter nbconvert --to python *.ipynb

     # 5. MASTER PATH, FORCE DOWNLOAD & DIRECT FOLDER ROUTING
    - name: Inject Fixes and Path Modifications
      run: |
        echo "🛠️ Injecting custom routing to skip File 2 completely..."
        
        # Standard Paths Fix
        sed -i "s|/content/||g" *.py || true
        sed -i "s|/content||g" *.py || true
        
        # 🔥 FILE 1 FORCE & ROUTING FIX: Videos ko direct YT_Tool_output me save karna
        if [ -f 01_A_Long_Fetcher_3.py ]; then
          echo "🔥 Patching File 1 to download directly into File 2's output folder..."
          
          # Force download logic (Same Date/Time bypass)
          sed -i "s/'quiet': True/'quiet': False/g" 01_A_Long_Fetcher_3.py || true
          sed -i "s/quiet=True/quiet=False/g" 01_A_Long_Fetcher_3.py || true
          sed -i '/for entry in feed.entries:/i \        has_downloaded_any = False' 01_A_Long_Fetcher_3.py || true
          sed -i '/download=True/a \                            has_downloaded_any = True' 01_A_Long_Fetcher_3.py || true
          
          # Sab se zaroori tabdeeli: Base input directory ko badal kar target output folder kar dena
          sed -i "s|base_dir = 'YT_Tool_Input'|base_dir = 'YT_Tool_output'|g" 01_A_Long_Fetcher_3.py || true
          sed -i 's|base_dir = "YT_Tool_Input"|base_dir = "YT_Tool_output"|g' 01_A_Long_Fetcher_3.py || true
          
          # Force download fallback logic (with new folder path 'YT_Tool_output')
          sed -i '/supabase.table(table_name).update/i \        if not has_downloaded_any and feed.entries:\n            print("⚠️ Same Date/Time detected! Forcing download of the last available video...")\n            last_entry = feed.entries[0]\n            try:\n                with yt_dlp.YoutubeDL(ydl_opts) as ydl:\n                    info = ydl.extract_info(last_entry.link, download=True)\n                    tmp = ydl.prepare_filename(info)\n                dur, ratio = get_video_metadata(tmp)\n                if ratio == "9:16":\n                    dest = os.path.join("YT_Tool_output", cat)\n                    os.makedirs(dest, exist_ok=True)\n                    shutil.move(tmp, os.path.join(dest, os.path.basename(tmp)))\n                else:\n                    make_shorts_with_blur(tmp, cat)\n                    b_dest = os.path.join(blogger_dir, cat)\n                    os.makedirs(b_dest, exist_ok=True)\n                    shutil.move(tmp, os.path.join(b_dest, os.path.basename(tmp)))\n            except Exception as ytdl_err:\n                print(f"❌ YouTube Library Error (yt-dlp) faced: {ytdl_err}")' 01_A_Long_Fetcher_3.py || true
        fi

        # FILE 3 FIX: Category folders ko barkrar rakhna
        if [ -f 03_C_Caption_Ai_3.py ]; then
          sed -i "s|'/YT_Tool_output'|'YT_Tool_output'|g" 03_C_Caption_Ai_3.py || true
          sed -i "s|\"/YT_Tool_output\"|\"YT_Tool_output\"|g" 03_C_Caption_Ai_3.py || true
          sed -i "s|'/YT_output_CC'|'YT_output_CC'|g" 03_C_Caption_Ai_3.py || true
          sed -i "s|\"/YT_output_CC\"|\"YT_output_CC\"|g" 03_C_Caption_Ai_3.py || true
          sed -i "s|out_file = os.path.join(OUTPUT_BASE_DIR, os.path.basename(video_path))|rel_path = os.path.relpath(video_path, BASE_DIR)\n            out_file = os.path.join(OUTPUT_BASE_DIR, rel_path)\n            os.makedirs(os.path.dirname(out_file), exist_ok=True)|g" 03_C_Caption_Ai_3.py || true
        fi
        
        # Main Notebook Engine Crash Bypass
        if [ -f All_Run_app_1.py ]; then
          sed -i '1s/^/def get_ipython():\n    class Dummy:\n        def system(self, cmd): pass\n    return Dummy()\n\n/' All_Run_app_1.py
        fi

    # 6. Execution with Single Secret Variable (DRIVE_URLS)
    - name: Execute Main Script App
      env:
        DRIVE_URLS: ${{ secrets.DRIVE_URLS }}
        PYTHONUNBUFFERED: "1"
      run: |
        echo "🔥 Executing the orchestrator application..."
        python -u All_Run_app_1.py

    # 7. Auto Environment Cleanup
    - name: Secure Environment Wipe
      if: always()
      run: |
        echo "🗑️ Cleaning up temporary python files..."
        rm -f *.py
        echo "✨ Environment cleaned up successfully!"
