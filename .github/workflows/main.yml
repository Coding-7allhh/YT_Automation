name: Force Run My Automation App

on:
  schedule:
    - cron: '0 4 * * *' # Pakistan time subah 9:00 AM
  workflow_dispatch: # Manual run ka button

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Required Packages
      run: |
        python -m pip install --upgrade pip
        pip install jupyter nbconvert supabase postgrest httpx moviepy gdown h11 cryptography ipython

    - name: Convert Main Notebook to Python
      run: |
        echo "🔄 Converting notebook to pure Python script..."
        jupyter nbconvert --to python *.ipynb

    # 🔥 CRASH-PROOF STEP: Is line se get_ipython ka error hamesha ke liye bypass ho jayega
    - name: Inject IPython Dummy Bypass
      run: |
        echo "🛠️ Injecting IPython bypass into converted python file..."
        # Yeh command script ki bilkul shuruat (Line 1) me fake get_ipython definition daal degi
        sed -i '1s/^/def get_ipython():\n    class Dummy:\n        def system(self, cmd): pass\n    return Dummy()\n\n/' All_Run_app_1.py

    - name: Execute Main Orchestrator Script
      env:
        DRIVE_URLS: ${{ secrets.DRIVE_URLS }}
       # SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        PYTHONUNBUFFERED: "1"
      run: |
        echo "🔥 Executing the orchestrator application..."
        python -u All_Run_app_1.py

    - name: Secure Environment Wipe
      if: always()
      run: |
        echo "🗑️ Cleaning up temporary python files..."
        rm -f *.py
        echo "✨ Environment cleaned up successfully!"
