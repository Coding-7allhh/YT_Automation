name: Force Run My Automation App

on:
  schedule:
    - cron: '0 4 * * *' # Pakistan Standard Time (PKT) ke mutabiq rozana subah 9:00 AM
  workflow_dispatch: # Manual run karne ke liye button

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 1. System Packages (FFmpeg, ImageMagick, Fonts) with Sudo
    - name: Install System Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y ffmpeg imagemagick fonts-liberation -qq

    # 2. All Python Libraries (Pip upgraded, MoviePy fixed to 2.0.0, AI & Web Packages)
    - name: Install All Python Packages
      run: |
        python -m pip install --upgrade pip
        pip install jupyter nbconvert supabase postgrest httpx gdown h11 cryptography ipython
        pip install yt-dlp feedparser tqdm requests beautifulsoup4 python-dateutil
        pip install assemblyai google-generativeai pydub numpy
        pip install moviepy==2.0.0

    # 3. ImageMagick Security Policy Fix with Root/Sudo Permissions
    - name: Fix ImageMagick Security Policy
      run: |
        echo "🛠️ Modifying ImageMagick policy with root permissions..."
        if [ -f /etc/ImageMagick-6/policy.xml ]; then
          sudo sed -i 's/domain="path" rights="none" pattern="@\*"/domain="path" rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml
        fi

    # 4. Notebook to Python conversion
    - name: Convert Main Notebook to Python
     
      run: |
        echo "🔄 Converting notebook to pure Python script..."
        jupyter nbconvert --to python *.ipynb

     # 5. 🔥 DIRECT ROUTING STEP: Video ko direct File 4 ke input (YT_output_CC) me save karna
    - name: Pre-Download Backup Video Directly For File 4
      run: |
        echo "📥 Downloading backup video from Google Drive directly into File 4 input folder..."
        # File 4 ka input folder 'YT_output_CC' hota hai, hum direct wahan folder bana rahe hain
        mkdir -p YT_output_CC
        
        # Drive link se video direct File 4 ke folder me download ho rahi hai
        gdown "https://drive.google.com/uc?id=1GgAxpDiYLOkv0E_BXjCpbvCr7oH-f_Vt" -O YT_output_CC/backup_example.mp4
        echo "✅ Backup video successfully saved inside YT_output_CC/ for Supabase!"

    # 6. MASTER PATH, JUPYTER BYPASS & FILE 3 AUTOMATIC SKIP PATTERN
    - name: Inject Fixes and Path Modifications
      run: |
        echo "🛠️ Cleaning paths and preparing scripts for direct Supabase uploading..."
        
        # Standard Paths Fix
        sed -i "s|/content/||g" *.py || true
        sed -i "s|/content||g" *.py || true
        
        # 🔥 FILE 4 PATH SAFETY: Check karna ke File 4 local paths 'YT_output_CC' ko sahi se padhay
        if [ -f "04_D_Url save Gemini 3.py" ]; then
          sed -i "s|'/YT_output_CC'|'YT_output_CC'|g" "04_D_Url save Gemini 3.py" || true
          sed -i "s|\"/YT_output_CC\"|\"YT_output_CC\"|g" "04_D_Url save Gemini 3.py" || true
        fi

        # 🔥 FILE 3 DISABLE: Agar All_Run_app_1.py File 3 ko chalaye toh usay khaali (skip) kar dena taake crash na ho
        if [ -f "03_C_Caption Ai 3.py" ]; then
          echo "⏭️ Emptying File 3 to safely bypass MoviePy rendering errors..."
          echo "print('⏭️ File 3 skipped: Video already sent to File 4 input!')" > "03_C_Caption Ai 3.py"
        fi
        
        # ALL FILES ENGINE CRASH BYPASS: Jupyter magic commands fix
        for f in *.py; do
          sed -i '1s/^/def get_ipython():\n    class Dummy:\n        def system(self, cmd): pass\n    return Dummy()\n\n/' "$f" || true
        done

    # 7. RUN MASTER APPLICATION (Runs All 4 Files Sequentially Like Old Times)
    - name: Run Automation Scripts
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PYTHONUNBUFFERED: "1"
      run: |
        echo "🚀 Triggering Main File Manager: All_Run_app_1.py"
        
        # Agar aapki main file ka naam space ke sath hai ya bagair space ke, dono surto me execute karega
        if [ -f All_Run_app_1.py ]; then
          python All_Run_app_1.py
        elif [ -f "All_Run_app_1.py" ]; then
          python "All_Run_app_1.py"
        else
          echo "⚠️ Main master file not found! Running individual files as backup chain..."
          python "01_A_Long Fetcher 3.py" || true
          python "02_B_Editor_App 3.py" || true
          python "03_C_Caption Ai 3.py" || true
          python "04_D_Url save Gemini 3.py" || true
        fi
    
    # 8. Auto Environment Cleanup
    - name: Secure Environment Wipe
      if: always()
      run: |
        echo "🗑️ Cleaning up temporary python files..."
        rm -f *.py
        echo "✨ Environment cleaned up successfully!"
