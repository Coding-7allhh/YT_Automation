name: Force Run My Automation App

on:
  schedule:
    - cron: '0 4 * * *' # Pakistan time subah 9:00 AM
  workflow_dispatch: # Manual run ka button

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    # GitHub par hi saari requirements install kar rahe hain
    - name: Install Required Packages
      run: |
        python -m pip install --upgrade pip
        pip install jupyter nbconvert supabase postgrest httpx moviepy gdown h11 cryptography ipython

    # 🔥 MAIN FIX HERE: Notebook ko convert karte waqt bash commands ko remove karna
    - name: Convert Main Notebook to Python
      run: |
        echo "🔄 Converting notebook and removing ipython notebook commands..."
        # Yeh setting notebook ki sari '!' wali lines ko automatic code se saaf kar degi
        jupyter nbconvert --to python --Exporter.default_preprocessors="['nbconvert.preprocessors.RegexRemovePreprocessor']" --RegexRemovePreprocessor.patterns="[\"^!.*\",\"^%.*\"]" *.ipynb

    - name: Execute Main Orchestrator Script
      env:
        DRIVE_URLS: ${{ secrets.DRIVE_URLS }}
        #SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        PYTHONUNBUFFERED: "1"
      run: |
        echo "🔥 Finding and executing the converted python script..."
        python -u *.py

    - name: Secure Environment Wipe
      if: always()
      run: |
        echo "🗑️ Cleaning up temporary python files..."
        rm -f *.py
        echo "✨ Environment cleaned up successfully!"
