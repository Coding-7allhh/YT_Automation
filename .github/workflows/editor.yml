name: AI Video Editor Workflow

on:
  # schedule:
    # روزانہ 04:00 UTC (9:00 AM PKT) پر خود بخود چلتا ہے
 #   - cron: '0 4 * * *'
  workflow_dispatch: # آپ کو مینوئل طریقے سے چلانے کے لیے بٹن کلک کرنے کی اجازت دیتا ہے

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🎬 Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core -qq

      - name: 📦 Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai pillow tqdm gdown

      - name: 📥 Download Video from Google Drive
        run: |
          mkdir -p YT_Tool_Input/sad_peotry/
          gdown "https://drive.google.com/uc?id=1rnzSPJcZzX2wW67RYOc8dUhaKbUHTK3e" -O YT_Tool_Input/sad_peotry/input_video.mp4
      - name: 🤖 Run the AI Editor Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python editor.py

      - name: 💾 Upload Edited Videos
        uses: actions/upload-artifact@v4
        with:
          name: Edited-Videos
          path: YT_Tool_output/
          retention-days: 5
