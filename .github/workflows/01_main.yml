
name: YT automatic Ai Tools Expert

on:
 # schedule:
    # روزانہ 04:00 UTC (9:00 AM PKT) پر خود بخود چلتا ہے
   # - cron: '0 4 * * *'
  workflow_dispatch: # آپ کو مینوئل طریقے سے چلانے کے لیے بٹن کلک کرنے کی اجازت دیتا ہے

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🎬 Install System Dependencies & Unlock ImageMagick
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y ffmpeg imagemagick fonts-liberation -qq
          sudo sed -i '/<policy domain="path" rights="none" pattern="@\*"/d' /etc/ImageMagick-6/policy.xml

      - name: 📦 Install Python Libraries
        run: |
         python -m pip install --upgrade pip
          # If a requirements.txt is present, install from it (and enable caching in future commits);
          # otherwise install the pinned list used previously.
          
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          
      - name: 📥 Download Video from Google Drive
        run: |
          mkdir -p YT_Tool_Input/sad_peotry/
          mkdir -p YT_Tool_output/sad_peotry/
          mkdir -p YT_output_CC/sad_peotry/
          
          gdown "https://drive.google.com/uc?id=1rnzSPJcZzX2wW67RYOc8dUhaKbUHTK3e" -O YT_Tool_Input/sad_peotry/input_video.mp4
          gdown "https://drive.google.com/uc?id=12leiHTs5RerU217DwiC1BNbfOLA7eceN" -O downloaded_logo.png
          gdown "https://drive.google.com/uc?id=1GgAxpDiYLOkv0E_BXjCpbvCr7oH-f_Vt" -O downloaded_outro.mp4
      
      - name: Execute Advanced Uploader
        env:
          # Pulls the secure API keys you set up in GitHub Secrets
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
     
        run: |
         #python fetcher.py
         python editor.py
         python caption.py
         python uploader.py

      - name: Save Data_Files as Artifacts (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: Saved Data_Files
          path: YT_output_CC/
          retention-days: 10
